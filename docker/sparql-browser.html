<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VKG SPARQL Browser (Movie / Tourism)</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.75rem; }
  select, button { font-size: 0.95rem; padding: 0.4rem 0.6rem; }
  button { cursor: pointer; }
  textarea { width: 100%; height: 8rem; font-family: ui-monospace, monospace; font-size: 0.9rem; box-sizing: border-box; }
  .examples button { margin: 0.15rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; font-size: 0.85rem; }
  th, td { border: 1px solid #8888; padding: 0.35rem 0.5rem; text-align: left; vertical-align: top; word-break: break-all; }
  th { background: #80808022; }
  #status { font-size: 0.85rem; opacity: 0.75; margin-top: 0.5rem; }
  #error { color: #d33; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>VKG SPARQL Browser</h1>
<p>Talks directly to the local Ontop endpoints from Phase 0 (<code>docker compose up -d</code> must be running). No server, no build step — just open this file in a browser.</p>

<div class="row">
  <label for="endpoint"><strong>Domain:</strong></label>
  <select id="endpoint">
    <option value="http://localhost:8081/sparql">Movie (:8081)</option>
    <option value="http://localhost:8082/sparql">Tourism (:8082)</option>
  </select>
  <button onclick="runQuery()">Run query</button>
</div>

<div class="row examples">
  <strong>Examples:</strong>
  <button onclick="setQuery('count')">Total triples</button>
  <button onclick="setQuery('classes')">Classes + instance counts</button>
  <button onclick="setQuery('properties')">Properties + usage counts</button>
  <button onclick="setQuery('sample')">Sample 20 triples</button>
  <button onclick="setQuery('churches')">Tourism: "Chiese" churches</button>
  <button onclick="setQuery('movies')">Movie: first 10 titles</button>
</div>

<textarea id="query">SELECT (COUNT(*) AS ?triples) WHERE { ?s ?p ?o }</textarea>

<div id="status"></div>
<div id="error"></div>
<div id="results"></div>

<script>
const QUERIES = {
  count: `SELECT (COUNT(*) AS ?triples) WHERE { ?s ?p ?o }`,
  classes: `SELECT ?class (COUNT(?s) AS ?instances) WHERE { ?s a ?class } GROUP BY ?class ORDER BY DESC(?instances)`,
  properties: `SELECT ?p (COUNT(*) AS ?uses) WHERE { ?s ?p ?o } GROUP BY ?p ORDER BY DESC(?uses)`,
  sample: `SELECT ?s ?p ?o WHERE { ?s ?p ?o } LIMIT 20`,
  churches: `PREFIX ex: <http://example.org/>\nSELECT ?cat ?name WHERE { ?cat a ex:ArtCategory ; ex:artcatname_it ?name } LIMIT 20`,
  movies: `PREFIX : <http://www.semanticweb.org/exogame/ontologies/2026/4/untitled-ontology-57#>\nSELECT ?movie ?title WHERE { ?movie :title ?title } LIMIT 10`,
};

function setQuery(key) {
  document.getElementById('query').value = QUERIES[key];
  const isTourism = key === 'churches';
  const isMovie = key === 'movies';
  if (isTourism) document.getElementById('endpoint').value = 'http://localhost:8082/sparql';
  if (isMovie) document.getElementById('endpoint').value = 'http://localhost:8081/sparql';
  runQuery();
}

async function runQuery() {
  const endpoint = document.getElementById('endpoint').value;
  const query = document.getElementById('query').value;
  const statusEl = document.getElementById('status');
  const errorEl = document.getElementById('error');
  const resultsEl = document.getElementById('results');
  errorEl.textContent = '';
  resultsEl.innerHTML = '';
  statusEl.textContent = 'Running...';

  const url = endpoint + '?query=' + encodeURIComponent(query);
  try {
    const resp = await fetch(url, { headers: { Accept: 'application/sparql-results+json' } });
    if (!resp.ok) {
      const text = await resp.text();
      throw new Error(`HTTP ${resp.status}\n${text}`);
    }
    const data = await resp.json();
    renderResults(data);
    const n = data.results && data.results.bindings ? data.results.bindings.length : 0;
    statusEl.textContent = `${n} row(s) from ${endpoint}`;
  } catch (err) {
    statusEl.textContent = '';
    errorEl.textContent = 'Query failed (is `docker compose up -d` running?):\n' + err.message;
  }
}

function renderResults(data) {
  const vars = data.head.vars;
  const bindings = data.results.bindings;
  if (bindings.length === 0) {
    document.getElementById('results').textContent = '(no results)';
    return;
  }
  let html = '<table><thead><tr>' + vars.map(v => `<th>${v}</th>`).join('') + '</tr></thead><tbody>';
  for (const row of bindings) {
    html += '<tr>' + vars.map(v => `<td>${row[v] ? row[v].value : ''}</td>`).join('') + '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('results').innerHTML = html;
}

runQuery();
</script>
</body>
</html>
